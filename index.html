<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D Car Racing Game</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: 16px; left: 16px;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    z-index: 10;
    user-select: none;
    pointer-events: none;
  }
  #hud .best {
    font-size: 14px;
    font-weight: normal;
    color: #f1c40f;
    margin-top: 2px;
  }
  #speedBar {
    position: fixed;
    top: 16px; right: 16px;
    color: #fff;
    font-size: 13px;
    text-align: right;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    z-index: 10;
    user-select: none;
    pointer-events: none;
  }

  /* ---------- Touch Controls ---------- */
  #touchControls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 24px 28px;
    z-index: 20;
    pointer-events: none;
  }
  .touch-btn {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.4);
    color: #fff;
    font-size: 32px;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    pointer-events: auto;
    backdrop-filter: blur(2px);
    transition: background 0.1s, transform 0.1s;
  }
  .touch-btn:active, .touch-btn.pressed {
    background: rgba(255,255,255,0.35);
    transform: scale(0.92);
  }

  /* ---------- Game Over Overlay ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(20,20,30,0.92) 0%, rgba(5,5,10,0.97) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 100;
    text-align: center;
    padding: 20px;
  }
  #overlay h1 {
    font-size: clamp(26px, 6vw, 42px);
    background: linear-gradient(90deg, #f1c40f, #e74c3c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  #overlay p {
    font-size: clamp(13px, 3vw, 15px);
    color: #aab;
    margin-bottom: 4px;
    max-width: 420px;
  }
  #overlay .finalScore {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: bold;
    color: #f1c40f;
    margin: 14px 0 6px;
  }
  #overlay .bestScoreText {
    font-size: 14px;
    color: #7fdbff;
    margin-bottom: 18px;
  }
  #overlay button, #carSelectScreen button {
    padding: 14px 44px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #4CAF50, #2ecc71);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(46, 204, 113, 0.45);
  }
  #overlay button:active, #carSelectScreen button:active { transform: scale(0.96); }
  #changeCarBtn {
    margin-top: 12px;
    background: linear-gradient(90deg, #34495e, #2c3e50) !important;
    box-shadow: none !important;
    font-size: 14px !important;
    padding: 10px 26px !important;
  }
  .hidden { display: none !important; }

  /* ---------- Car Selection Screen ---------- */
  #carSelectScreen {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(20,20,30,0.94) 0%, rgba(5,5,10,0.98) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 150;
    text-align: center;
    padding: 16px;
  }
  #carSelectScreen h1 {
    font-size: clamp(22px, 5.5vw, 34px);
    background: linear-gradient(90deg, #f1c40f, #e74c3c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  #carSelectScreen .subtitle {
    font-size: 13px;
    color: #9aa2b1;
    margin-bottom: 14px;
  }
  .preview-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .nav-arrow {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    width: 42px; height: 42px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .nav-arrow:active { background: rgba(255,255,255,0.28); }
  #previewCanvas {
    width: 240px; height: 260px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0));
    border: 1px solid rgba(255,255,255,0.12);
    touch-action: none;
  }
  #carNameLabel {
    margin-top: 12px;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 0.5px;
    min-height: 24px;
  }
  #carTagline {
    font-size: 12px;
    color: #8b93a5;
    margin-top: 2px;
    min-height: 16px;
  }
  #carDots {
    display: flex;
    gap: 7px;
    margin: 14px 0 18px;
  }
  .car-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .car-dot.active {
    background: #f1c40f;
    transform: scale(1.3);
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden">
  <div>Score: <span id="scoreVal">0</span> &nbsp;|&nbsp; 🪙 Coins: <span id="coinsVal">0</span></div>
  <div class="best">Best: <span id="bestVal">0</span></div>
</div>
<div id="speedBar" class="hidden">Speed: <span id="speedVal">0</span> km/h</div>

<div id="touchControls" class="hidden">
  <div class="touch-btn" id="btnLeft">&#10094;</div>
  <div class="touch-btn" id="btnRight">&#10095;</div>
</div>

<!-- ================= CAR SELECTION SCREEN ================= -->
<div id="carSelectScreen">
  <h1>🏎️ SELECT YOUR CAR</h1>
  <div class="subtitle">Dodge the oncoming traffic and survive as long as you can.<br>Choose your car, then press PLAY GAME.</div>
  <div class="preview-row">
    <button class="nav-arrow" id="prevCarBtn">&#10094;</button>
    <canvas id="previewCanvas"></canvas>
    <button class="nav-arrow" id="nextCarBtn">&#10095;</button>
  </div>
  <div id="carNameLabel">Red Speedster</div>
  <div id="carTagline"></div>
  <div id="carDots"></div>
  <button id="playBtn">▶ PLAY GAME</button>
</div>

<!-- ================= GAME OVER OVERLAY ================= -->
<div id="overlay" class="hidden">
  <h1>💥 GAME OVER</h1>
  <div id="finalScoreWrap">
    <div class="finalScore">Final Score: <span id="finalScoreVal">0</span></div>
    <div class="bestScoreText" id="bestScoreText"></div>
  </div>
  <button id="startBtn">↻ RESTART</button>
  <button id="changeCarBtn">🚗 Change Car</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   SETUP
   ========================================================= */
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b3d9);
scene.fog = new THREE.Fog(0x87b3d9, 30, 140);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   LIGHTING
   ========================================================= */
const ambient = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(-20, 35, -10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
scene.add(sun);
scene.add(sun.target);

/* =========================================================
   DAY / NIGHT CYCLE
   ========================================================= */
const DAY_NIGHT_CYCLE_MS = 45000; // one full day -> night -> day cycle
const dayNightStartTime = Date.now();
let nightFactor = 0; // 0 = full day, 1 = full night, smoothly interpolated

const SKY_DAY = new THREE.Color(0x87b3d9);
const SKY_NIGHT = new THREE.Color(0x0a0e1a);
const SUN_DAY_COLOR = new THREE.Color(0xffffff);
const SUN_NIGHT_COLOR = new THREE.Color(0xaac4ff);
const _skyColor = new THREE.Color();
const _sunColor = new THREE.Color();

// simple star field, only visible as the sky darkens
const starCount = 160;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 80 + Math.random() * 60;
  starPositions[i * 3] = Math.cos(angle) * radius;
  starPositions[i * 3 + 1] = 20 + Math.random() * 60;
  starPositions[i * 3 + 2] = Math.sin(angle) * radius;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, transparent: true, opacity: 0 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

function updateDayNightCycle() {
  const t = ((Date.now() - dayNightStartTime) % DAY_NIGHT_CYCLE_MS) / DAY_NIGHT_CYCLE_MS;
  // smooth oscillation between 0 and 1, no sudden jump at the loop point
  nightFactor = (1 - Math.cos(2 * Math.PI * t)) / 2;

  _skyColor.copy(SKY_DAY).lerp(SKY_NIGHT, nightFactor);
  scene.background = _skyColor;
  scene.fog.color.copy(_skyColor);

  ambient.intensity = 0.65 - nightFactor * 0.45;
  sun.intensity = 0.9 - nightFactor * 0.65;
  _sunColor.copy(SUN_DAY_COLOR).lerp(SUN_NIGHT_COLOR, nightFactor);
  sun.color.copy(_sunColor);

  starMat.opacity = Math.max(0, nightFactor - 0.15) * 1.1;
}

/* =========================================================
   WEATHER (rain gradually rolls in and out, adds difficulty
   via reduced visibility and slightly slippery steering)
   ========================================================= */
const WEATHER_CYCLE_MS = 38000;
const weatherStartTime = Date.now();
let rainFactor = 0; // 0 = clear, 1 = heavy rain

const RAIN_TINT = new THREE.Color(0x8fa0ac);
const FOG_NEAR_CLEAR = 30, FOG_FAR_CLEAR = 140;
const FOG_NEAR_RAIN = 9, FOG_FAR_RAIN = 48;

const RAIN_COUNT = 420;
const rainPositions = new Float32Array(RAIN_COUNT * 3);
for (let i = 0; i < RAIN_COUNT; i++) {
  rainPositions[i * 3] = (Math.random() - 0.5) * 42;
  rainPositions[i * 3 + 1] = Math.random() * 22;
  rainPositions[i * 3 + 2] = 8 + (Math.random() - 0.5) * 60;
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
const rainMat = new THREE.PointsMaterial({ color: 0xaad4ff, size: 0.16, transparent: true, opacity: 0 });
const rain = new THREE.Points(rainGeo, rainMat);
scene.add(rain);

function updateWeather(dt) {
  const t = ((Date.now() - weatherStartTime) % WEATHER_CYCLE_MS) / WEATHER_CYCLE_MS;
  const raw = (1 - Math.cos(2 * Math.PI * t)) / 2;
  // shape the curve so clear skies dominate and rain arrives in smooth, shorter bursts
  rainFactor = Math.pow(raw, 2.2);

  // fog thickens and the sky greys slightly during rain (visibility drops = harder to react)
  scene.fog.near = FOG_NEAR_CLEAR + (FOG_NEAR_RAIN - FOG_NEAR_CLEAR) * rainFactor;
  scene.fog.far = FOG_FAR_CLEAR + (FOG_FAR_RAIN - FOG_FAR_CLEAR) * rainFactor;
  _skyColor.lerp(RAIN_TINT, rainFactor * 0.45);
  scene.background = _skyColor;
  scene.fog.color.copy(_skyColor);
  ambient.intensity = Math.max(0.15, ambient.intensity - rainFactor * 0.12);
  sun.intensity = Math.max(0.1, sun.intensity - rainFactor * 0.15);

  // falling rain particles, recycled from the top once they hit the ground
  rainMat.opacity = rainFactor * 0.6;
  if (rainFactor > 0.02) {
    const pos = rainGeo.attributes.position.array;
    const fallSpeed = 26 * dt;
    for (let i = 0; i < RAIN_COUNT; i++) {
      pos[i * 3 + 1] -= fallSpeed;
      if (pos[i * 3 + 1] < 0) {
        pos[i * 3 + 1] = 20 + Math.random() * 4;
        pos[i * 3] = (Math.random() - 0.5) * 42;
        pos[i * 3 + 2] = 8 + (Math.random() - 0.5) * 60;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  if (rainNoiseGain) {
    rainNoiseGain.gain.value = rainFactor * 0.1;
  }
}


/* =========================================================
   ROAD
   ========================================================= */
const LANE_WIDTH = 4;
const NUM_LANES = 3;
const ROAD_WIDTH = LANE_WIDTH * NUM_LANES;
const ROAD_LENGTH = 400;
const laneX = (i) => (i - (NUM_LANES - 1) / 2) * LANE_WIDTH;

const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3f, roughness: 1 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.receiveShadow = true;
scene.add(road);

// grass either side
const grassGeo = new THREE.PlaneGeometry(200, ROAD_LENGTH);
const grassMat = new THREE.MeshStandardMaterial({ color: 0x3f7d3a, roughness: 1 });
const grassL = new THREE.Mesh(grassGeo, grassMat);
grassL.rotation.x = -Math.PI / 2;
grassL.position.set(-(ROAD_WIDTH / 2 + 100), -0.01, 0);
grassL.receiveShadow = true;
scene.add(grassL);
const grassR = grassL.clone();
grassR.position.x = ROAD_WIDTH / 2 + 100;
scene.add(grassR);

// road edge curbs
function makeCurb(x) {
  const curbGeo = new THREE.BoxGeometry(0.3, 0.15, ROAD_LENGTH);
  const curbMat = new THREE.MeshStandardMaterial({ color: 0xdedede });
  const curb = new THREE.Mesh(curbGeo, curbMat);
  curb.position.set(x, 0.05, 0);
  curb.castShadow = true;
  curb.receiveShadow = true;
  scene.add(curb);
}
makeCurb(-ROAD_WIDTH / 2 - 0.15);
makeCurb(ROAD_WIDTH / 2 + 0.15);

// dashed lane-divider lines (recycled/scrolled to simulate infinite road)
const laneLines = [];
const DASH_LEN = 3, DASH_GAP = 3, DASH_SPACING = DASH_LEN + DASH_GAP;
const dashesPerLine = Math.ceil(ROAD_LENGTH / DASH_SPACING) + 2;

function buildLaneLines() {
  const dashGeo = new THREE.PlaneGeometry(0.2, DASH_LEN);
  const dashMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  for (let l = 1; l < NUM_LANES; l++) {
    const x = laneX(l - 1) + LANE_WIDTH / 2;
    for (let i = 0; i < dashesPerLine; i++) {
      const dash = new THREE.Mesh(dashGeo, dashMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(x, 0.01, -ROAD_LENGTH / 2 + i * DASH_SPACING);
      dash.receiveShadow = true;
      scene.add(dash);
      laneLines.push(dash);
    }
  }
}
buildLaneLines();

// simple roadside trees for parallax speed cues
const trees = [];
function buildTrees() {
  const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 1.2, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5b3a21 });
  const leafGeo = new THREE.ConeGeometry(1.1, 2.4, 7);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6a2f });
  const spacing = 8;
  const count = Math.ceil(ROAD_LENGTH / spacing) + 2;
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < count; i++) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 0.6;
      trunk.castShadow = true;
      const leaves = new THREE.Mesh(leafGeo, leafMat);
      leaves.position.y = 2.0;
      leaves.castShadow = true;
      group.add(trunk, leaves);
      group.position.set(side * (ROAD_WIDTH / 2 + 6 + Math.random() * 4), 0, -ROAD_LENGTH / 2 + i * spacing + Math.random() * 3);
      scene.add(group);
      trees.push(group);
    }
  }
}
buildTrees();

/* =========================================================
   CAR DESIGNS (player-selectable roster)
   ========================================================= */
const CAR_DESIGNS = [
  { id: 0, name: "Red Speedster",     tagline: "Balanced and quick off the line",       body: 0xe74c3c, window: 0x1b1f26 },
  { id: 1, name: "Ambulance Racer",   tagline: "Emergency response livery",             body: 0xf5f5f5, window: 0x1a1a1a, cross: true,               lightBar: [0xff2b2b, 0xffffff] },
  { id: 2, name: "Fire Rescue",       tagline: "Bold red and orange alert lights",      body: 0xc0392b, window: 0x1a1a1a,                             lightBar: [0xff2b2b, 0xff8c1a] },
  { id: 3, name: "Highway Patrol",    tagline: "Dark pursuit-spec bodywork",            body: 0x1c2331, window: 0x000000, roofAccent: 0x2472e8,       lightBar: [0xff2b2b, 0x2472e8] },
  { id: 4, name: "🏎️ Formula Racer",  tagline: "Low, sleek, built for speed",           body: 0xffffff, window: 0x111111, stripe: 0x2472e8, spoiler: true },
  { id: 5, name: "Police Racer",      tagline: "Blue & white pursuit unit",             body: 0xf5f5f5, window: 0x1a1a1a, roofAccent: 0x1e3a8a,       lightBar: [0xff2b2b, 0x2b7dff] },
];

const SELECTED_CAR_KEY = 'racer3dSelectedCar';
let selectedCarIndex = Number(localStorage.getItem(SELECTED_CAR_KEY));
if (isNaN(selectedCarIndex) || !CAR_DESIGNS[selectedCarIndex]) selectedCarIndex = 0;

/* =========================================================
   CAR FACTORY (player + enemies + preview all share this builder)
   ========================================================= */
function buildCar(design, isPlayer) {
  const group = new THREE.Group();

  const bodyGeo = new THREE.BoxGeometry(1.7, 0.55, 3.4);
  const bodyMat = new THREE.MeshStandardMaterial({ color: design.body, roughness: 0.4, metalness: 0.3 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.55;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const cabinGeo = new THREE.BoxGeometry(1.3, 0.5, 1.6);
  const cabinMat = new THREE.MeshStandardMaterial({ color: design.window || 0x1b1f26, roughness: 0.2, metalness: 0.1 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0, 0.98, -0.15);
  cabin.castShadow = true;
  group.add(cabin);

  // optional roof accent band (Highway Patrol stripe, Police roof color)
  if (design.roofAccent) {
    const accentGeo = new THREE.BoxGeometry(1.32, 0.06, 1.64);
    const accentMat = new THREE.MeshStandardMaterial({ color: design.roofAccent, roughness: 0.3, metalness: 0.2 });
    const accent = new THREE.Mesh(accentGeo, accentMat);
    accent.position.set(0, 1.24, -0.15);
    accent.castShadow = true;
    group.add(accent);
  }

  // optional center racing stripe down hood + roof (Formula Racer)
  if (design.stripe) {
    const stripeGeo = new THREE.BoxGeometry(0.34, 0.04, 3.42);
    const stripeMat = new THREE.MeshStandardMaterial({ color: design.stripe, roughness: 0.3, metalness: 0.2 });
    const stripeMesh = new THREE.Mesh(stripeGeo, stripeMat);
    stripeMesh.position.set(0, 0.835, 0);
    group.add(stripeMesh);
  }

  // optional rear spoiler (Formula Racer)
  if (design.spoiler) {
    const pillarGeo = new THREE.BoxGeometry(0.08, 0.32, 0.08);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const wingGeo = new THREE.BoxGeometry(1.55, 0.06, 0.4);
    const wingMat = new THREE.MeshStandardMaterial({ color: design.body, roughness: 0.4, metalness: 0.3 });
    const pillarL = new THREE.Mesh(pillarGeo, pillarMat);
    pillarL.position.set(-0.6, 0.85, -1.55);
    pillarL.castShadow = true;
    const pillarR = pillarL.clone();
    pillarR.position.x = 0.6;
    const wing = new THREE.Mesh(wingGeo, wingMat);
    wing.position.set(0, 1.03, -1.55);
    wing.castShadow = true;
    group.add(pillarL, pillarR, wing);
  }

  // optional red cross badge (Ambulance Racer)
  if (design.cross) {
    const crossMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.4 });
    const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.03, 0.46), crossMat);
    vBar.position.set(0, 1.24, 0.95);
    const hBar = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.03, 0.13), crossMat);
    hBar.position.set(0, 1.24, 0.95);
    group.add(vBar, hBar);
  }

  const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.32, 12);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
  const wheelPositions = [
    [-0.85, 0.35, 1.15], [0.85, 0.35, 1.15],
    [-0.85, 0.35, -1.15], [0.85, 0.35, -1.15]
  ];
  const wheels = [];
  wheelPositions.forEach(p => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(p[0], p[1], p[2]);
    wheel.castShadow = true;
    group.add(wheel);
    wheels.push(wheel);
  });

  // headlights
  // headlights - automatically switch on as night falls (both player and enemy cars)
  const lightGeo = new THREE.SphereGeometry(0.13, 8, 8);
  const lightMat = new THREE.MeshStandardMaterial({
    color: 0xfff3b0, emissive: 0xfff3b0, emissiveIntensity: 0
  });
  const hlL = new THREE.Mesh(lightGeo, lightMat);
  hlL.position.set(-0.6, 0.55, 1.72);
  const hlR = hlL.clone();
  hlR.material = lightMat;
  hlR.position.x = 0.6;
  group.add(hlL, hlR);
  group.userData.headlightMat = lightMat;

  // taillights (red) — visible on enemy cars driving toward the player
  const tailGeo = new THREE.SphereGeometry(0.11, 8, 8);
  const tailMat = new THREE.MeshStandardMaterial({ color: 0xff2b2b, emissive: 0xff2b2b, emissiveIntensity: isPlayer ? 0 : 1.1 });
  const tlL = new THREE.Mesh(tailGeo, tailMat);
  tlL.position.set(-0.6, 0.55, -1.72);
  const tlR = tlL.clone();
  tlR.position.x = 0.6;
  group.add(tlL, tlR);

  // optional flashing light bar (emergency vehicles)
  if (design.lightBar) {
    const barBaseGeo = new THREE.BoxGeometry(0.85, 0.1, 0.26);
    const barBaseMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const barBase = new THREE.Mesh(barBaseGeo, barBaseMat);
    barBase.position.set(0, 1.32, -0.15);
    barBase.castShadow = true;
    group.add(barBase);

    const lightGeoBar = new THREE.BoxGeometry(0.38, 0.08, 0.22);
    const matA = new THREE.MeshStandardMaterial({ color: design.lightBar[0], emissive: design.lightBar[0], emissiveIntensity: 0.3 });
    const lightA = new THREE.Mesh(lightGeoBar, matA);
    lightA.position.set(-0.22, 1.33, -0.15);
    group.add(lightA);

    const matB = new THREE.MeshStandardMaterial({ color: design.lightBar[1], emissive: design.lightBar[1], emissiveIntensity: 0.3 });
    const lightB = new THREE.Mesh(lightGeoBar, matB);
    lightB.position.set(0.22, 1.33, -0.15);
    group.add(lightB);

    group.userData.lightBarMats = [matA, matB];
  }

  group.userData.wheels = wheels;
  return group;
}

function disposeGroup(group) {
  group.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
}

let player = buildCar(CAR_DESIGNS[selectedCarIndex], true);
player.position.set(0, 0, 8);
scene.add(player);

/* =========================================================
   GAME STATE
   ========================================================= */
let currentLane = 1; // 0,1,2 -> maps to laneX()
let targetX = laneX(currentLane);
let running = false;
let score = 0;
let coinsCount = 0;
let bestScore = Number(localStorage.getItem('racer3dBestScore')) || 0;
let baseSpeed = 22;      // world units / second
let speed = baseSpeed;
const MAX_SPEED = 60;
let elapsedTime = 0;
let lastFrameTime = performance.now();

const enemyCars = [];
const ENEMY_COLORS = [0x2472e8, 0x27ae60, 0xf1c40f, 0x8e44ad, 0xbdc3c7, 0xe67e22];
let spawnTimer = 0;
let spawnInterval = 1.1; // seconds between spawns, tightens as speed increases
let coinSpawnTimer = 0;
let coinSpawnInterval = 1.4; // seconds between coin spawns

const playerBox = new THREE.Box3();
const enemyBox = new THREE.Box3();

/* =========================================================
   CAMERA (chase cam)
   ========================================================= */
function updateCamera() {
  const camOffset = new THREE.Vector3(0, 4.2, 8.5);
  const desired = player.position.clone().add(camOffset);
  camera.position.lerp(desired, 0.12);
  const lookTarget = player.position.clone().add(new THREE.Vector3(0, 1.2, -4));
  camera.lookAt(lookTarget);
}
camera.position.set(0, 4.2, 16.5);
camera.lookAt(0, 1, 0);

/* =========================================================
   SOUND (Web Audio API synth — engine rumble + crash)
   ========================================================= */
let audioCtx = null;
let engineOsc = null, engineGain = null, engineFilter = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function startEngineSound() {
  try {
    const ctxA = getAudioCtx();
    if (engineOsc) return;
    engineOsc = ctxA.createOscillator();
    const engineOsc2 = ctxA.createOscillator();
    engineFilter = ctxA.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 400;
    engineGain = ctxA.createGain();
    engineGain.gain.value = 0.05;

    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 55;
    engineOsc2.type = 'square';
    engineOsc2.frequency.value = 27.5;

    engineOsc.connect(engineFilter);
    engineOsc2.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(ctxA.destination);

    engineOsc.start();
    engineOsc2.start();
    engineOsc.userData2 = engineOsc2;
  } catch (e) { /* audio unavailable */ }
}

function updateEngineSound(speedRatio) {
  if (!engineOsc || !audioCtx) return;
  const freq = 45 + speedRatio * 90;
  engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.08);
  if (engineOsc.userData2) engineOsc.userData2.frequency.setTargetAtTime(freq / 2, audioCtx.currentTime, 0.08);
  if (engineFilter) engineFilter.frequency.setTargetAtTime(300 + speedRatio * 900, audioCtx.currentTime, 0.1);
}

function stopEngineSound() {
  try {
    if (engineOsc) {
      engineOsc.stop();
      if (engineOsc.userData2) engineOsc.userData2.stop();
      engineOsc.disconnect();
    }
    if (engineGain) engineGain.disconnect();
  } catch (e) {}
  engineOsc = null; engineGain = null; engineFilter = null;
}

function playCrashSound() {
  try {
    const ctxA = getAudioCtx();
    const noiseBuf = ctxA.createBuffer(1, ctxA.sampleRate * 0.4, ctxA.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const noise = ctxA.createBufferSource();
    noise.buffer = noiseBuf;
    const noiseGain = ctxA.createGain();
    noiseGain.gain.value = 0.5;
    noise.connect(noiseGain);
    noiseGain.connect(ctxA.destination);
    noise.start();

    const thud = ctxA.createOscillator();
    thud.type = 'square';
    thud.frequency.setValueAtTime(120, ctxA.currentTime);
    thud.frequency.exponentialRampToValueAtTime(30, ctxA.currentTime + 0.35);
    const thudGain = ctxA.createGain();
    thudGain.gain.setValueAtTime(0.35, ctxA.currentTime);
    thudGain.gain.exponentialRampToValueAtTime(0.001, ctxA.currentTime + 0.4);
    thud.connect(thudGain);
    thudGain.connect(ctxA.destination);
    thud.start();
    thud.stop(ctxA.currentTime + 0.4);
  } catch (e) { /* audio unavailable */ }
}

function unlockAudio() {
  getAudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type, volume, startDelay) {
  try {
    const ctxA = getAudioCtx();
    const osc = ctxA.createOscillator();
    const gain = ctxA.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctxA.destination);
    const startTime = ctxA.currentTime + (startDelay || 0);
    gain.gain.setValueAtTime(volume || 0.2, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.start(startTime);
    osc.stop(startTime + duration);
  } catch (e) { /* audio unavailable */ }
}

function playCoinSound() {
  playTone(880, 0.1, 'sine', 0.18, 0);
  playTone(1320, 0.12, 'sine', 0.14, 0.05);
}

// ---- Rain ambience (continuous, volume fades in/out with rainFactor) ----
let rainNoiseSource = null, rainNoiseGain = null;
function startRainAmbience() {
  try {
    if (rainNoiseSource) return;
    const ctxA = getAudioCtx();
    const bufferSize = ctxA.sampleRate * 2;
    const buffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.6;
    rainNoiseSource = ctxA.createBufferSource();
    rainNoiseSource.buffer = buffer;
    rainNoiseSource.loop = true;
    const filter = ctxA.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1400;
    rainNoiseGain = ctxA.createGain();
    rainNoiseGain.gain.value = 0;
    rainNoiseSource.connect(filter);
    filter.connect(rainNoiseGain);
    rainNoiseGain.connect(ctxA.destination);
    rainNoiseSource.start();
  } catch (e) { /* audio unavailable */ }
}

function stopRainAmbience() {
  try {
    if (rainNoiseSource) {
      rainNoiseSource.stop();
      rainNoiseSource.disconnect();
    }
    if (rainNoiseGain) rainNoiseGain.disconnect();
  } catch (e) {}
  rainNoiseSource = null; rainNoiseGain = null;
}

/* =========================================================
   CONTROLS
   ========================================================= */
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft', 'ArrowRight', 'a', 'd', 'A', 'D'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function moveLeft() {
  if (currentLane > 0) {
    currentLane--;
    targetX = laneX(currentLane);
  }
}
function moveRight() {
  if (currentLane < NUM_LANES - 1) {
    currentLane++;
    targetX = laneX(currentLane);
  }
}

let leftHeldKey = false, rightHeldKey = false;
let lastLaneInputTime = 0;
const LANE_INPUT_DEBOUNCE = 220; // ms, so holding a key doesn't cross multiple lanes instantly

function pollKeyboardInput() {
  const now = performance.now();
  const left = keys['ArrowLeft'] || keys['a'] || keys['A'];
  const right = keys['ArrowRight'] || keys['d'] || keys['D'];
  if (left && !leftHeldKey && now - lastLaneInputTime > LANE_INPUT_DEBOUNCE) {
    moveLeft(); lastLaneInputTime = now;
  }
  if (right && !rightHeldKey && now - lastLaneInputTime > LANE_INPUT_DEBOUNCE) {
    moveRight(); lastLaneInputTime = now;
  }
  leftHeldKey = left; rightHeldKey = right;
}

// touch buttons
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
function bindTouchBtn(el, fn) {
  const handler = (e) => { e.preventDefault(); unlockAudio(); fn(); el.classList.add('pressed'); };
  el.addEventListener('touchstart', handler, { passive: false });
  el.addEventListener('mousedown', handler);
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev =>
    el.addEventListener(ev, () => el.classList.remove('pressed'))
  );
}
bindTouchBtn(btnLeft, moveLeft);
bindTouchBtn(btnRight, moveRight);

// swipe support anywhere on canvas
let touchStartX = null;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
canvas.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 40) moveRight();
  else if (dx < -40) moveLeft();
  touchStartX = null;
}, { passive: true });

/* =========================================================
   ENEMY SPAWNING & UPDATE
   ========================================================= */
function spawnEnemy() {
  const lane = Math.floor(Math.random() * NUM_LANES);
  const color = ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
  const car = buildCar({ body: color, window: 0x1b1f26 }, false);
  car.rotation.y = Math.PI; // facing the player
  car.position.set(laneX(lane), 0, -ROAD_LENGTH / 2 - 5);
  scene.add(car);
  enemyCars.push(car);
}

function updateEnemies(dt) {
  for (let i = enemyCars.length - 1; i >= 0; i--) {
    const car = enemyCars[i];
    car.position.z += speed * dt;
    if (car.userData.headlightMat) {
      car.userData.headlightMat.emissiveIntensity = 0.05 + nightFactor * 1.35;
    }
    if (car.position.z > 14) {
      scene.remove(car);
      enemyCars.splice(i, 1);
      score += 1;
      continue;
    }
    enemyBox.setFromObject(car);
    playerBox.setFromObject(player);
    if (playerBox.intersectsBox(enemyBox)) {
      endGame();
      return;
    }
  }
}

/* =========================================================
   COINS
   ========================================================= */
const coinsList = [];
const coinGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.12, 20);
const coinMat = new THREE.MeshStandardMaterial({
  color: 0xf1c40f, emissive: 0xf1c40f, emissiveIntensity: 0.35, metalness: 0.7, roughness: 0.25
});
const coinBox = new THREE.Box3();

function spawnCoin() {
  const lane = Math.floor(Math.random() * NUM_LANES);
  const coin = new THREE.Mesh(coinGeo, coinMat);
  coin.rotation.x = Math.PI / 2;
  coin.castShadow = true;
  coin.position.set(laneX(lane), 0.75, -ROAD_LENGTH / 2 - 5);
  scene.add(coin);
  coinsList.push(coin);
}

function updateCoins(dt) {
  for (let i = coinsList.length - 1; i >= 0; i--) {
    const coin = coinsList[i];
    coin.position.z += speed * dt;
    coin.rotation.z += dt * 3.2; // spin for shine

    if (coin.position.z > 14) {
      scene.remove(coin);
      coinsList.splice(i, 1);
      continue;
    }

    coinBox.setFromObject(coin);
    playerBox.setFromObject(player);
    if (playerBox.intersectsBox(coinBox)) {
      scene.remove(coin);
      coinsList.splice(i, 1);
      coinsCount++;
      score += 5; // small bonus reward on top of the survival score
      playCoinSound();
    }
  }
}

/* =========================================================
   SCENERY SCROLL (lane dashes + trees recycle to loop)
   ========================================================= */
function updateScenery(dt) {
  const delta = speed * dt;
  laneLines.forEach(dash => {
    dash.position.z += delta;
    if (dash.position.z > ROAD_LENGTH / 2) dash.position.z -= ROAD_LENGTH;
  });
  trees.forEach(tree => {
    tree.position.z += delta;
    if (tree.position.z > ROAD_LENGTH / 2) tree.position.z -= ROAD_LENGTH;
  });
}

/* =========================================================
   PLAYER MOVEMENT & WHEEL SPIN
   ========================================================= */
function updatePlayer(dt) {
  const steerResponse = 8 - rainFactor * 3; // slightly slippery in the rain, still fully controllable
  player.position.x += (targetX - player.position.x) * Math.min(1, dt * steerResponse);
  player.rotation.z = (targetX - player.position.x) * -0.12;
  const spin = speed * dt * 4;
  player.userData.wheels.forEach(w => { w.rotation.x -= spin; });
}

/* =========================================================
   HUD
   ========================================================= */
const scoreVal = document.getElementById('scoreVal');
const coinsVal = document.getElementById('coinsVal');
const bestVal = document.getElementById('bestVal');
const speedVal = document.getElementById('speedVal');

function updateHUD() {
  scoreVal.textContent = Math.floor(score);
  coinsVal.textContent = coinsCount;
  bestVal.textContent = bestScore;
  speedVal.textContent = Math.round(speed * 7.5); // stylised km/h readout
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
  lastFrameTime = now;

  updateDayNightCycle();
  updateWeather(dt);

  // player headlights automatically switch on as night falls
  if (player.userData.headlightMat) {
    player.userData.headlightMat.emissiveIntensity = 0.05 + nightFactor * 1.35;
  }

  if (running) {
    elapsedTime += dt;
    pollKeyboardInput();
    updatePlayer(dt);

    // difficulty ramp
    speed = Math.min(MAX_SPEED, baseSpeed + elapsedTime * 0.9);
    spawnInterval = Math.max(0.45, 1.1 - elapsedTime * 0.01);

    updateScenery(dt);

    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnEnemy();
    }
    updateEnemies(dt);

    coinSpawnTimer += dt;
    if (coinSpawnTimer >= coinSpawnInterval) {
      coinSpawnTimer = 0;
      coinSpawnInterval = 1.0 + Math.random() * 1.0;
      spawnCoin();
    }
    updateCoins(dt);

    // flash the player's light bar (Ambulance / Fire Rescue / Highway Patrol / Police)
    if (player.userData.lightBarMats) {
      const flashOn = Math.floor(now / 250) % 2 === 0;
      const [matA, matB] = player.userData.lightBarMats;
      matA.emissiveIntensity = flashOn ? 1.5 : 0.15;
      matB.emissiveIntensity = flashOn ? 0.15 : 1.5;
    }

    score += dt * 3; // continuous score-over-time growth
    updateEngineSound(Math.min(1, (speed - baseSpeed) / (MAX_SPEED - baseSpeed)));
    updateHUD();
  }

  updateCamera();
  renderer.render(scene, camera);
}

/* =========================================================
   CAR SELECTION SCREEN
   ========================================================= */
const carSelectScreen = document.getElementById('carSelectScreen');
const previewCanvasEl = document.getElementById('previewCanvas');
const carNameLabel = document.getElementById('carNameLabel');
const carTagline = document.getElementById('carTagline');
const carDotsEl = document.getElementById('carDots');

const previewRenderer = new THREE.WebGLRenderer({ canvas: previewCanvasEl, antialias: true, alpha: true });
const previewScene = new THREE.Scene();
const previewCamera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
previewCamera.position.set(2.4, 1.7, 3.4);
previewCamera.lookAt(0, 0.5, 0);

const previewAmbient = new THREE.AmbientLight(0xffffff, 0.85);
previewScene.add(previewAmbient);
const previewDir = new THREE.DirectionalLight(0xffffff, 0.9);
previewDir.position.set(3, 5, 4);
previewScene.add(previewDir);

function resizePreview() {
  const w = previewCanvasEl.clientWidth || 240;
  const h = previewCanvasEl.clientHeight || 260;
  previewRenderer.setSize(w, h, false);
  previewRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  previewCamera.aspect = w / h;
  previewCamera.updateProjectionMatrix();
}
window.addEventListener('resize', resizePreview);

let previewIndex = selectedCarIndex;
let previewCar = null;

function setPreviewCar(index) {
  if (previewCar) {
    previewScene.remove(previewCar);
    disposeGroup(previewCar);
  }
  const design = CAR_DESIGNS[index];
  previewCar = buildCar(design, true);
  previewCar.rotation.y = Math.PI / 5;
  previewScene.add(previewCar);
}

function updateCarSelectUI() {
  const design = CAR_DESIGNS[previewIndex];
  carNameLabel.textContent = design.name;
  carTagline.textContent = design.tagline || '';
  document.querySelectorAll('.car-dot').forEach((d, i) => d.classList.toggle('active', i === previewIndex));
  setPreviewCar(previewIndex);
}

// build dot indicators
CAR_DESIGNS.forEach((design, i) => {
  const dot = document.createElement('div');
  dot.className = 'car-dot';
  dot.title = design.name;
  dot.addEventListener('click', () => { previewIndex = i; updateCarSelectUI(); });
  carDotsEl.appendChild(dot);
});

document.getElementById('prevCarBtn').addEventListener('click', () => {
  previewIndex = (previewIndex - 1 + CAR_DESIGNS.length) % CAR_DESIGNS.length;
  updateCarSelectUI();
});
document.getElementById('nextCarBtn').addEventListener('click', () => {
  previewIndex = (previewIndex + 1) % CAR_DESIGNS.length;
  updateCarSelectUI();
});

// swipe support on the preview canvas for mobile navigation
let previewTouchStartX = null;
previewCanvasEl.addEventListener('touchstart', e => { previewTouchStartX = e.touches[0].clientX; }, { passive: true });
previewCanvasEl.addEventListener('touchend', e => {
  if (previewTouchStartX === null) return;
  const dx = e.changedTouches[0].clientX - previewTouchStartX;
  if (dx > 30) { previewIndex = (previewIndex - 1 + CAR_DESIGNS.length) % CAR_DESIGNS.length; updateCarSelectUI(); }
  else if (dx < -30) { previewIndex = (previewIndex + 1) % CAR_DESIGNS.length; updateCarSelectUI(); }
  previewTouchStartX = null;
}, { passive: true });

function animatePreview() {
  requestAnimationFrame(animatePreview);
  if (carSelectScreen.classList.contains('hidden')) return;
  if (previewCar) {
    previewCar.rotation.y += 0.007;
    if (previewCar.userData.headlightMat) {
      previewCar.userData.headlightMat.emissiveIntensity = 0.05 + nightFactor * 1.35;
    }
    if (previewCar.userData.lightBarMats) {
      const flashOn = Math.floor(Date.now() / 250) % 2 === 0;
      const [matA, matB] = previewCar.userData.lightBarMats;
      matA.emissiveIntensity = flashOn ? 1.5 : 0.15;
      matB.emissiveIntensity = flashOn ? 0.15 : 1.5;
    }
  }
  previewRenderer.render(previewScene, previewCamera);
}

resizePreview();
updateCarSelectUI();
requestAnimationFrame(animatePreview);

document.getElementById('playBtn').addEventListener('click', () => {
  unlockAudio();
  selectedCarIndex = previewIndex;
  localStorage.setItem(SELECTED_CAR_KEY, String(selectedCarIndex));
  carSelectScreen.classList.add('hidden');
  startGame();
});

document.getElementById('changeCarBtn').addEventListener('click', () => {
  running = false;
  stopEngineSound();
  stopRainAmbience();
  overlay.classList.add('hidden');
  previewIndex = selectedCarIndex;
  updateCarSelectUI();
  carSelectScreen.classList.remove('hidden');
});

/* =========================================================
   GAME START / OVER / RESTART
   ========================================================= */
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const speedBar = document.getElementById('speedBar');
const touchControls = document.getElementById('touchControls');
const finalScoreWrap = document.getElementById('finalScoreWrap');
const finalScoreVal = document.getElementById('finalScoreVal');
const bestScoreText = document.getElementById('bestScoreText');

function resetWorld() {
  enemyCars.forEach(c => scene.remove(c));
  enemyCars.length = 0;
  coinsList.forEach(c => scene.remove(c));
  coinsList.length = 0;
  currentLane = 1;
  targetX = laneX(currentLane);

  // rebuild the player car using the currently selected design
  scene.remove(player);
  disposeGroup(player);
  player = buildCar(CAR_DESIGNS[selectedCarIndex], true);
  player.position.set(0, 0, 8);
  player.rotation.z = 0;
  scene.add(player);

  score = 0;
  coinsCount = 0;
  elapsedTime = 0;
  spawnTimer = 0;
  coinSpawnTimer = 0;
  speed = baseSpeed;
}

function startGame() {
  unlockAudio();
  resetWorld();
  running = true;
  overlay.classList.add('hidden');
  hud.classList.remove('hidden');
  speedBar.classList.remove('hidden');
  touchControls.classList.remove('hidden');
  startEngineSound();
  startRainAmbience();
  lastFrameTime = performance.now();
}

function endGame() {
  running = false;
  playCrashSound();
  stopEngineSound();
  stopRainAmbience();
  const finalScore = Math.floor(score);
  if (finalScore > bestScore) {
    bestScore = finalScore;
    localStorage.setItem('racer3dBestScore', bestScore);
    bestScoreText.textContent = '🏆 New Best Score!';
  } else {
    bestScoreText.textContent = 'Best: ' + bestScore;
  }
  finalScoreVal.textContent = finalScore;
  overlay.classList.remove('hidden');
  hud.classList.add('hidden');
  speedBar.classList.add('hidden');
  touchControls.classList.add('hidden');
}

startBtn.addEventListener('click', startGame);

requestAnimationFrame(animate);
