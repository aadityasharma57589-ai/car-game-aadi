<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D Car Racing Game</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: 16px; left: 16px;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    z-index: 10;
    user-select: none;
    pointer-events: none;
  }
  #hud .best {
    font-size: 14px;
    font-weight: normal;
    color: #f1c40f;
    margin-top: 2px;
  }
  #speedBar {
    position: fixed;
    top: 16px; right: 16px;
    color: #fff;
    font-size: 13px;
    text-align: right;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    z-index: 10;
    user-select: none;
    pointer-events: none;
  }

  /* ---------- Touch Controls ---------- */
  #touchControls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 24px 28px;
    z-index: 20;
    pointer-events: none;
  }
  .touch-btn {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.4);
    color: #fff;
    font-size: 32px;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    pointer-events: auto;
    backdrop-filter: blur(2px);
    transition: background 0.1s, transform 0.1s;
  }
  .touch-btn:active, .touch-btn.pressed {
    background: rgba(255,255,255,0.35);
    transform: scale(0.92);
  }

  /* ---------- Start / Game Over Overlay ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(20,20,30,0.92) 0%, rgba(5,5,10,0.97) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 100;
    text-align: center;
    padding: 20px;
  }
  #overlay h1 {
    font-size: clamp(26px, 6vw, 42px);
    background: linear-gradient(90deg, #f1c40f, #e74c3c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  #overlay p {
    font-size: clamp(13px, 3vw, 15px);
    color: #aab;
    margin-bottom: 4px;
    max-width: 420px;
  }
  #overlay .finalScore {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: bold;
    color: #f1c40f;
    margin: 14px 0 6px;
  }
  #overlay .bestScoreText {
    font-size: 14px;
    color: #7fdbff;
    margin-bottom: 18px;
  }
  #overlay button {
    margin-top: 18px;
    padding: 14px 44px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #4CAF50, #2ecc71);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(46, 204, 113, 0.45);
  }
  #overlay button:active { transform: scale(0.96); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden">
  <div>Score: <span id="scoreVal">0</span> &nbsp;|&nbsp; 🪙 Coins: <span id="coinsVal">0</span></div>
  <div class="best">Best: <span id="bestVal">0</span></div>
</div>
<div id="speedBar" class="hidden">Speed: <span id="speedVal">0</span> km/h</div>

<div id="touchControls" class="hidden">
  <div class="touch-btn" id="btnLeft">&#10094;</div>
  <div class="touch-btn" id="btnRight">&#10095;</div>
</div>

<div id="overlay">
  <h1>🏎️ 3D CAR RACER</h1>
  <p>Dodge the oncoming traffic and survive as long as you can.<br>
     Use Arrow Keys / A-D on desktop, or the on-screen buttons on mobile.</p>
  <div id="finalScoreWrap" class="hidden">
    <div class="finalScore">Final Score: <span id="finalScoreVal">0</span></div>
    <div class="bestScoreText" id="bestScoreText"></div>
  </div>
  <button id="startBtn">▶ START GAME</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   SETUP
   ========================================================= */
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b3d9);
scene.fog = new THREE.Fog(0x87b3d9, 30, 140);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* =========================================================
   LIGHTING
   ========================================================= */
const ambient = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(-20, 35, -10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
scene.add(sun);
scene.add(sun.target);

/* =========================================================
   ROAD
   ========================================================= */
const LANE_WIDTH = 4;
const NUM_LANES = 3;
const ROAD_WIDTH = LANE_WIDTH * NUM_LANES;
const ROAD_LENGTH = 400;
const laneX = (i) => (i - (NUM_LANES - 1) / 2) * LANE_WIDTH;

const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3f, roughness: 1 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.receiveShadow = true;
scene.add(road);

// grass either side
const grassGeo = new THREE.PlaneGeometry(200, ROAD_LENGTH);
const grassMat = new THREE.MeshStandardMaterial({ color: 0x3f7d3a, roughness: 1 });
const grassL = new THREE.Mesh(grassGeo, grassMat);
grassL.rotation.x = -Math.PI / 2;
grassL.position.set(-(ROAD_WIDTH / 2 + 100), -0.01, 0);
grassL.receiveShadow = true;
scene.add(grassL);
const grassR = grassL.clone();
grassR.position.x = ROAD_WIDTH / 2 + 100;
scene.add(grassR);

// road edge curbs
function makeCurb(x) {
  const curbGeo = new THREE.BoxGeometry(0.3, 0.15, ROAD_LENGTH);
  const curbMat = new THREE.MeshStandardMaterial({ color: 0xdedede });
  const curb = new THREE.Mesh(curbGeo, curbMat);
  curb.position.set(x, 0.05, 0);
  curb.castShadow = true;
  curb.receiveShadow = true;
  scene.add(curb);
}
makeCurb(-ROAD_WIDTH / 2 - 0.15);
makeCurb(ROAD_WIDTH / 2 + 0.15);

// dashed lane-divider lines (recycled/scrolled to simulate infinite road)
const laneLines = [];
const DASH_LEN = 3, DASH_GAP = 3, DASH_SPACING = DASH_LEN + DASH_GAP;
const dashesPerLine = Math.ceil(ROAD_LENGTH / DASH_SPACING) + 2;

function buildLaneLines() {
  const dashGeo = new THREE.PlaneGeometry(0.2, DASH_LEN);
  const dashMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  for (let l = 1; l < NUM_LANES; l++) {
    const x = laneX(l - 1) + LANE_WIDTH / 2;
    for (let i = 0; i < dashesPerLine; i++) {
      const dash = new THREE.Mesh(dashGeo, dashMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(x, 0.01, -ROAD_LENGTH / 2 + i * DASH_SPACING);
      dash.receiveShadow = true;
      scene.add(dash);
      laneLines.push(dash);
    }
  }
}
buildLaneLines();

// simple roadside trees for parallax speed cues
const trees = [];
function buildTrees() {
  const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 1.2, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5b3a21 });
  const leafGeo = new THREE.ConeGeometry(1.1, 2.4, 7);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6a2f });
  const spacing = 8;
  const count = Math.ceil(ROAD_LENGTH / spacing) + 2;
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < count; i++) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 0.6;
      trunk.castShadow = true;
      const leaves = new THREE.Mesh(leafGeo, leafMat);
      leaves.position.y = 2.0;
      leaves.castShadow = true;
      group.add(trunk, leaves);
      group.position.set(side * (ROAD_WIDTH / 2 + 6 + Math.random() * 4), 0, -ROAD_LENGTH / 2 + i * spacing + Math.random() * 3);
      scene.add(group);
      trees.push(group);
    }
  }
}
buildTrees();

/* =========================================================
   CAR FACTORY (player + enemies share this builder)
   ========================================================= */
function buildCar(bodyColor, isPlayer) {
  const group = new THREE.Group();

  const bodyGeo = new THREE.BoxGeometry(1.7, 0.55, 3.4);
  const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.4, metalness: 0.3 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.55;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const cabinGeo = new THREE.BoxGeometry(1.3, 0.5, 1.6);
  const cabinMat = new THREE.MeshStandardMaterial({ color: 0x1b1f26, roughness: 0.2, metalness: 0.1 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0, 0.98, -0.15);
  cabin.castShadow = true;
  group.add(cabin);

  const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.32, 12);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
  const wheelPositions = [
    [-0.85, 0.35, 1.15], [0.85, 0.35, 1.15],
    [-0.85, 0.35, -1.15], [0.85, 0.35, -1.15]
  ];
  const wheels = [];
  wheelPositions.forEach(p => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(p[0], p[1], p[2]);
    wheel.castShadow = true;
    group.add(wheel);
    wheels.push(wheel);
  });

  // headlights
  const lightGeo = new THREE.SphereGeometry(0.13, 8, 8);
  const lightMat = new THREE.MeshStandardMaterial({
    color: 0xfff3b0, emissive: isPlayer ? 0xfff3b0 : 0x000000, emissiveIntensity: isPlayer ? 1.4 : 0
  });
  const hlL = new THREE.Mesh(lightGeo, lightMat);
  hlL.position.set(-0.6, 0.55, 1.72);
  const hlR = hlL.clone();
  hlR.position.x = 0.6;
  group.add(hlL, hlR);

  // taillights (red) — visible on enemy cars driving toward the player
  const tailGeo = new THREE.SphereGeometry(0.11, 8, 8);
  const tailMat = new THREE.MeshStandardMaterial({ color: 0xff2b2b, emissive: 0xff2b2b, emissiveIntensity: isPlayer ? 0 : 1.1 });
  const tlL = new THREE.Mesh(tailGeo, tailMat);
  tlL.position.set(-0.6, 0.55, -1.72);
  const tlR = tlL.clone();
  tlR.position.x = 0.6;
  group.add(tlL, tlR);

  group.userData.wheels = wheels;
  return group;
}

const PLAYER_COLOR = 0xe74c3c;
const player = buildCar(PLAYER_COLOR, true);
player.position.set(0, 0, 8);
scene.add(player);

/* =========================================================
   GAME STATE
   ========================================================= */
let currentLane = 1; // 0,1,2 -> maps to laneX()
let targetX = laneX(currentLane);
let running = false;
let score = 0;
let bestScore = Number(localStorage.getItem('racer3dBestScore')) || 0;
let baseSpeed = 22;      // world units / second
let speed = baseSpeed;
const MAX_SPEED = 60;
let elapsedTime = 0;
let lastFrameTime = performance.now();

const enemyCars = [];
const ENEMY_COLORS = [0x2472e8, 0x27ae60, 0xf1c40f, 0x8e44ad, 0xbdc3c7, 0xe67e22];
let spawnTimer = 0;
let spawnInterval = 1.1; // seconds between spawns, tightens as speed increases

const playerBox = new THREE.Box3();
const enemyBox = new THREE.Box3();

/* =========================================================
   CAMERA (chase cam)
   ========================================================= */
function updateCamera() {
  const camOffset = new THREE.Vector3(0, 4.2, 8.5);
  const desired = player.position.clone().add(camOffset);
  camera.position.lerp(desired, 0.12);
  const lookTarget = player.position.clone().add(new THREE.Vector3(0, 1.2, -4));
  camera.lookAt(lookTarget);
}
camera.position.set(0, 4.2, 16.5);
camera.lookAt(0, 1, 0);

/* =========================================================
   SOUND (Web Audio API synth — engine rumble + crash)
   ========================================================= */
let audioCtx = null;
let engineOsc = null, engineGain = null, engineFilter = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function startEngineSound() {
  try {
    const ctxA = getAudioCtx();
    if (engineOsc) return;
    engineOsc = ctxA.createOscillator();
    const engineOsc2 = ctxA.createOscillator();
    engineFilter = ctxA.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 400;
    engineGain = ctxA.createGain();
    engineGain.gain.value = 0.05;

    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 55;
    engineOsc2.type = 'square';
    engineOsc2.frequency.value = 27.5;

    engineOsc.connect(engineFilter);
    engineOsc2.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(ctxA.destination);

    engineOsc.start();
    engineOsc2.start();
    engineOsc.userData2 = engineOsc2;
  } catch (e) { /* audio unavailable */ }
}

function updateEngineSound(speedRatio) {
  if (!engineOsc || !audioCtx) return;
  const freq = 45 + speedRatio * 90;
  engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.08);
  if (engineOsc.userData2) engineOsc.userData2.frequency.setTargetAtTime(freq / 2, audioCtx.currentTime, 0.08);
  if (engineFilter) engineFilter.frequency.setTargetAtTime(300 + speedRatio * 900, audioCtx.currentTime, 0.1);
}

function stopEngineSound() {
  try {
    if (engineOsc) {
      engineOsc.stop();
      if (engineOsc.userData2) engineOsc.userData2.stop();
      engineOsc.disconnect();
    }
    if (engineGain) engineGain.disconnect();
  } catch (e) {}
  engineOsc = null; engineGain = null; engineFilter = null;
}

function playCrashSound() {
  try {
    const ctxA = getAudioCtx();
    const noiseBuf = ctxA.createBuffer(1, ctxA.sampleRate * 0.4, ctxA.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const noise = ctxA.createBufferSource();
    noise.buffer = noiseBuf;
    const noiseGain = ctxA.createGain();
    noiseGain.gain.value = 0.5;
    noise.connect(noiseGain);
    noiseGain.connect(ctxA.destination);
    noise.start();

    const thud = ctxA.createOscillator();
    thud.type = 'square';
    thud.frequency.setValueAtTime(120, ctxA.currentTime);
    thud.frequency.exponentialRampToValueAtTime(30, ctxA.currentTime + 0.35);
    const thudGain = ctxA.createGain();
    thudGain.gain.setValueAtTime(0.35, ctxA.currentTime);
    thudGain.gain.exponentialRampToValueAtTime(0.001, ctxA.currentTime + 0.4);
    thud.connect(thudGain);
    thudGain.connect(ctxA.destination);
    thud.start();
    thud.stop(ctxA.currentTime + 0.4);
  } catch (e) { /* audio unavailable */ }
}

function unlockAudio() {
  getAudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

/* =========================================================
   CONTROLS
   ========================================================= */
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft', 'ArrowRight', 'a', 'd', 'A', 'D'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function moveLeft() {
  if (currentLane > 0) {
    currentLane--;
    targetX = laneX(currentLane);
  }
}
function moveRight() {
  if (currentLane < NUM_LANES - 1) {
    currentLane++;
    targetX = laneX(currentLane);
  }
}

let leftHeldKey = false, rightHeldKey = false;
let lastLaneInputTime = 0;
const LANE_INPUT_DEBOUNCE = 220; // ms, so holding a key doesn't cross multiple lanes instantly

function pollKeyboardInput() {
  const now = performance.now();
  const left = keys['ArrowLeft'] || keys['a'] || keys['A'];
  const right = keys['ArrowRight'] || keys['d'] || keys['D'];
  if (left && !leftHeldKey && now - lastLaneInputTime > LANE_INPUT_DEBOUNCE) {
    moveLeft(); lastLaneInputTime = now;
  }
  if (right && !rightHeldKey && now - lastLaneInputTime > LANE_INPUT_DEBOUNCE) {
    moveRight(); lastLaneInputTime = now;
  }
  leftHeldKey = left; rightHeldKey = right;
}

// touch buttons
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
function bindTouchBtn(el, fn) {
  const handler = (e) => { e.preventDefault(); unlockAudio(); fn(); el.classList.add('pressed'); };
  el.addEventListener('touchstart', handler, { passive: false });
  el.addEventListener('mousedown', handler);
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev =>
    el.addEventListener(ev, () => el.classList.remove('pressed'))
  );
}
bindTouchBtn(btnLeft, moveLeft);
bindTouchBtn(btnRight, moveRight);

// swipe support anywhere on canvas
let touchStartX = null;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
canvas.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 40) moveRight();
  else if (dx < -40) moveLeft();
  touchStartX = null;
}, { passive: true });

/* =========================================================
   ENEMY SPAWNING & UPDATE
   ========================================================= */
function spawnEnemy() {
  const lane = Math.floor(Math.random() * NUM_LANES);
  const color = ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
  const car = buildCar(color, false);
  car.rotation.y = Math.PI; // facing the player
  car.position.set(laneX(lane), 0, -ROAD_LENGTH / 2 - 5);
  scene.add(car);
  enemyCars.push(car);
}

function updateEnemies(dt) {
  for (let i = enemyCars.length - 1; i >= 0; i--) {
    const car = enemyCars[i];
    car.position.z += speed * dt;
    if (car.position.z > 14) {
      scene.remove(car);
      enemyCars.splice(i, 1);
      score += 1;
      continue;
    }
    enemyBox.setFromObject(car);
    playerBox.setFromObject(player);
    if (playerBox.intersectsBox(enemyBox)) {
      endGame();
      return;
    }
  }
}

/* =========================================================
   SCENERY SCROLL (lane dashes + trees recycle to loop)
   ========================================================= */
function updateScenery(dt) {
  const delta = speed * dt;
  laneLines.forEach(dash => {
    dash.position.z += delta;
    if (dash.position.z > ROAD_LENGTH / 2) dash.position.z -= ROAD_LENGTH;
  });
  trees.forEach(tree => {
    tree.position.z += delta;
    if (tree.position.z > ROAD_LENGTH / 2) tree.position.z -= ROAD_LENGTH;
  });
}

/* =========================================================
   PLAYER MOVEMENT & WHEEL SPIN
   ========================================================= */
function updatePlayer(dt) {
  player.position.x += (targetX - player.position.x) * Math.min(1, dt * 8);
  player.rotation.z = (targetX - player.position.x) * -0.12;
  const spin = speed * dt * 4;
  player.userData.wheels.forEach(w => { w.rotation.x -= spin; });
}

/* =========================================================
   HUD
   ========================================================= */
const scoreVal = document.getElementById('scoreVal');
const bestVal = document.getElementById('bestVal');
const speedVal = document.getElementById('speedVal');

function updateHUD() {
  scoreVal.textContent = Math.floor(score);
  bestVal.textContent = bestScore;
  speedVal.textContent = Math.round(speed * 6); // stylised km/h readout
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
  lastFrameTime = now;

  if (running) {
    elapsedTime += dt;
    pollKeyboardInput();
    updatePlayer(dt);

    // difficulty ramp
    speed = Math.min(MAX_SPEED, baseSpeed + elapsedTime * 0.9);
    spawnInterval = Math.max(0.45, 1.1 - elapsedTime * 0.01);

    updateScenery(dt);

    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnEnemy();
    }
    updateEnemies(dt);

    score += dt * 3; // continuous score-over-time growth
    updateEngineSound(Math.min(1, (speed - baseSpeed) / (MAX_SPEED - baseSpeed)));
    updateHUD();
  }

  updateCamera();
  renderer.render(scene, camera);
}

/* =========================================================
   GAME START / OVER / RESTART
   ========================================================= */
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const speedBar = document.getElementById('speedBar');
const touchControls = document.getElementById('touchControls');
const finalScoreWrap = document.getElementById('finalScoreWrap');
const finalScoreVal = document.getElementById('finalScoreVal');
const bestScoreText = document.getElementById('bestScoreText');

function resetWorld() {
  enemyCars.forEach(c => scene.remove(c));
  enemyCars.length = 0;
  currentLane = 1;
  targetX = laneX(currentLane);
  player.position.set(0, 0, 8);
  player.rotation.z = 0;
  score = 0;
  elapsedTime = 0;
  spawnTimer = 0;
  speed = baseSpeed;
}

function startGame() {
  unlockAudio();
  resetWorld();
  running = true;
  overlay.classList.add('hidden');
  hud.classList.remove('hidden');
  speedBar.classList.remove('hidden');
  touchControls.classList.remove('hidden');
  finalScoreWrap.classList.add('hidden');
  startEngineSound();
  lastFrameTime = performance.now();
}

function endGame() {
  running = false;
  playCrashSound();
  stopEngineSound();
  const finalScore = Math.floor(score);
  if (finalScore > bestScore) {
    bestScore = finalScore;
    localStorage.setItem('racer3dBestScore', bestScore);
    bestScoreText.textContent = '🏆 New Best Score!';
  } else {
    bestScoreText.textContent = 'Best: ' + bestScore;
  }
  finalScoreVal.textContent = finalScore;
  finalScoreWrap.classList.remove('hidden');
  startBtn.textContent = '↻ RESTART';
  overlay.classList.remove('hidden');
  hud.classList.add('hidden');
  speedBar.classList.add('hidden');
  touchControls.classList.add('hidden');
}

startBtn.addEventListener('click', startGame);

requestAnimationFrame(animate);
</script>
</body>
</html>
